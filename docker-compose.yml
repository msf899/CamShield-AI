version: "3.9"

services:
  backend:
    build: ./backend
    container_name: camshield-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/camshield.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    network_mode: host   # Required for network scanning
    cap_add:
      - NET_ADMIN        # Required for Scapy ARP scanning
      - NET_RAW
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: camshield-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
